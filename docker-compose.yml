version: "3.8"
services:
  # Local Bot API server: rimuove il limite 20 MB del Bot API standard.
  # Richiede TELEGRAM_API_ID e TELEGRAM_API_HASH (ottenibili da https://my.telegram.org).
  # Esposto SOLO in LAN (8081) — non pubblicare, altrimenti i file partono dal tuo server.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      # --local: i file vengono serviti localmente, non passano per i server Telegram
      TELEGRAM_API_ARGS: "--local --verbosity 1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      # Esposto solo in LAN — NON mappare su interfaccia pubblica
      - "127.0.0.1:8081:8081"

  botg:
    image: filippogrande/botg-saving-files:latest
    container_name: botg
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    volumes:
      - ./salvataggi:/mnt/truenas-bot
    environment:
      # OBBLIGATORIO: sostituisci con il token reale del tuo bot Telegram
      TELEGRAM_TOKEN: "REPLACE_WITH_YOUR_TELEGRAM_TOKEN"
      # Directory di salvataggio nel container (puoi modificare)
      SAVE_DIR: "/mnt/truenas-bot"
      # Lista di chat autorizzate, separata da virgola (opzionale)
      ALLOWED_CHAT_IDS: ""
      # Notifica di avvio (true/false) e chat id di destinazione (opzionale)
      STARTUP_NOTIFY: "false"
      STARTUP_CHAT_ID: ""
      # Se true il bot avvia anche il watcher giornaliero interno (consigliato: false)
      WATCHER_ENABLED: "false"
      # Credenziali Reddit (opzionali, se vuoi usare asyncpraw)
      REDDIT_CLIENT_ID: ""
      REDDIT_CLIENT_SECRET: ""
      REDDIT_USER_AGENT: "telegram-bot-reddit"
      # Base URL del local Bot API server (rimuove il limite 20 MB)
      BOT_API_BASE_URL: "http://telegram-bot-api:8081/bot"
    # non esporre porte pubbliche: il bot usa la Telegram API in outbound

  watcher:
    image: filippogrande/botg-saving-files:latest
    container_name: botg_watcher
    depends_on:
      - botg
    restart: "no"
    volumes:
      - ./salvataggi:/mnt/truenas-bot
    environment:
      TELEGRAM_TOKEN: "REPLACE_WITH_YOUR_TELEGRAM_TOKEN"
      SAVE_DIR: "/mnt/truenas-bot"
      REDDIT_CLIENT_ID: ""
      REDDIT_CLIENT_SECRET: ""
      REDDIT_USER_AGENT: "telegram-bot-reddit"
    command: ["python", "run_watcher.py"]
    # Questo servizio esegue una sola run del watcher e termina

volumes:
  telegram-bot-api-data:
    # Dati del local Bot API server (file temporanei, log)
